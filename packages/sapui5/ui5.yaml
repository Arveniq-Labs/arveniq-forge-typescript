specVersion: "3.0"
metadata:
  name: arveniq.forge.sapui5
type: library
framework:
  name: OpenUI5
  version: "1.136.15"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: themelib_sap_horizon
builder:
  libraryPreload:
    # Keep this AMD resource separately loadable: the CLI's preload analyzer cannot parse its new.target syntax.
    excludes:
      - arveniq/forge/sapui5/thirdparty/markdown-it.js
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
    - name: ui5-tooling-modules-task
      afterTask: ui5-tooling-transpile-task
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
    - name: ui5-tooling-modules-middleware
      afterMiddleware: ui5-tooling-transpile-middleware
