specVersion: "3.0"
metadata:
  name: arveniq.forge.sample
type: application
resources:
  configuration:
    paths:
      webapp: dist
framework:
  name: OpenUI5
  version: "1.136.15"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /api/forge-chat
      configuration:
        baseUri: http://127.0.0.1:8091/api/forge-chat
